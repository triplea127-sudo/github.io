<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#103d76">
<meta name="description" content="小学生と保護者のためのサッカー学習図鑑。22のワザと10問クイズで学べます。">
<title>サッカーマスター｜小学生と保護者の学習図鑑</title>
<style>
  :root{color-scheme:light;--ink:#192b40;--muted:#60738a;--line:#e3eaf2;--blue:#135ca6;--blue-dark:#103d76;--bg:#f3f7fb;--white:#fff;--shadow:0 9px 28px rgba(19,51,88,.075)}
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;min-width:290px;background:var(--bg);color:var(--ink);font-family:"Yu Gothic","Hiragino Kaku Gothic ProN","Meiryo",system-ui,sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased}
  button,a{font:inherit}
  button{cursor:pointer}
  button:disabled{cursor:default}
  a{color:inherit;text-decoration:none}
  :focus-visible{outline:3px solid #f3b43f;outline-offset:3px}
  .shell{max-width:1000px;margin:0 auto;padding:0 22px}
  .site-header{background:var(--white);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  .header-inner{display:flex;min-height:67px;align-items:center;justify-content:space-between;gap:16px}
  .brand{display:inline-flex;gap:10px;align-items:center;font-weight:900;letter-spacing:-.05em;color:#184774;font-size:19px;white-space:nowrap}
  .brand-mark{display:grid;place-items:center;background:#e9f2ff;border-radius:12px;width:37px;height:37px;font-size:23px}
  .header-right{display:flex;align-items:center;gap:12px}
  .offline-pill{border:1px solid #cce9df;color:#14664e;background:#e9f9f3;border-radius:30px;font-size:12px;font-weight:800;padding:5px 11px;white-space:nowrap}
  .header-home{font-size:13px;font-weight:800;background:#f3f7fa;border:1px solid #dce6ee;border-radius:999px;padding:7px 13px;color:#2d536f}
  main{min-height:calc(100vh - 128px)}
  .footer{padding:24px 0 32px;color:#78899b;text-align:center;font-size:12px;line-height:1.9}
  .footer strong{color:#536b83}
  .hero{margin:34px auto 25px;border-radius:27px;overflow:hidden;color:#fff;position:relative;background:linear-gradient(115deg,#0e386b 0%,#15549a 65%,#247ac0 100%);box-shadow:0 16px 36px rgba(10,58,106,.16)}
  .hero:after{content:"";position:absolute;right:-80px;top:-110px;width:370px;height:370px;border:35px solid rgba(255,255,255,.07);border-radius:50%;pointer-events:none}
  .hero:before{content:"";position:absolute;right:45px;bottom:-150px;width:260px;height:260px;border:1px solid rgba(255,255,255,.13);border-radius:50%;pointer-events:none}
  .hero-content{position:relative;z-index:1;padding:43px 44px 45px}
  .eyebrow{font-size:12px;font-weight:900;letter-spacing:.12em;opacity:.84}
  h1,h2,h3,p{margin-top:0}
  h1{font-size:clamp(35px,5vw,54px);line-height:1.23;letter-spacing:-.065em;margin:13px 0 12px;font-weight:900}
  .hero p{font-size:16px;color:#d8eaff;max-width:610px;margin:0}
  .hero-pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}
  .hero-pills span{font-size:12px;font-weight:800;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);padding:5px 12px;border-radius:999px}
  .section-head{display:flex;gap:12px;justify-content:space-between;align-items:end;margin-bottom:15px}
  .section-head h2{font-size:20px;letter-spacing:-.04em;margin:0}
  .section-head p{font-size:13px;color:var(--muted);margin:3px 0 0}
  .feature-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
  .feature{background:#fff;text-align:left;border:1px solid var(--line);border-radius:19px;padding:23px 22px 21px;box-shadow:var(--shadow);transition:transform .18s,border-color .18s,box-shadow .18s;width:100%;min-height:204px;display:flex;flex-direction:column;align-items:flex-start}
  .feature:hover,.category-card:hover{transform:translateY(-3px);border-color:#a7cce9;box-shadow:0 14px 30px rgba(18,63,113,.11)}
  .feature .feature-icon{font-size:26px;background:#edf6ff;width:48px;height:48px;display:grid;place-items:center;border-radius:15px;margin-bottom:18px}
  .feature.green .feature-icon{background:#e8f8ed}.feature.purple .feature-icon{background:#f2eafe}.feature.orange .feature-icon{background:#fff3df}
  .feature strong{font-size:17px;line-height:1.45;letter-spacing:-.03em;margin-bottom:6px}
  .feature small{font-size:12px;color:var(--muted);line-height:1.5}
  .feature-arrow{margin-top:auto;align-self:flex-end;color:#45739c;font-size:22px;line-height:1}
  .playlist{display:flex;gap:15px;align-items:center;margin:18px 0 35px;border-radius:18px;border:1px solid #e5eaf1;background:white;padding:19px 22px;transition:background .18s;box-shadow:var(--shadow)}
  .playlist:hover{background:#f9fbfd}
  .yt-bubble{border-radius:13px;background:#fff0f0;color:#d32628;display:grid;place-items:center;font-size:23px;width:49px;height:49px;flex:none}
  .playlist-body{flex:1}.playlist-body strong{display:block;font-size:16px}.playlist-body span{display:block;color:var(--muted);font-size:12px;margin-top:2px}
  .playlist-arrow{font-size:21px;color:#5a7793}
  .page-top{padding:30px 0 24px}
  .back{border:0;background:transparent;padding:5px 0;color:#3b668c;font-size:13px;font-weight:850;display:inline-flex;align-items:center;gap:5px}
  .page-title{font-size:clamp(24px,3.6vw,31px);line-height:1.35;letter-spacing:-.04em;margin:14px 0 6px}
  .intro{color:var(--muted);font-size:14px;margin:0}
  .mode-switch{display:inline-grid;grid-template-columns:1fr 1fr;gap:5px;background:#e8eef5;padding:5px;border-radius:14px;margin-top:20px;max-width:100%}
  .mode-switch button{border:0;border-radius:10px;background:transparent;padding:9px 17px;color:#516a84;font-size:13px;font-weight:850;white-space:nowrap}
  .mode-switch button[aria-pressed=true]{background:white;color:#184b85;box-shadow:0 2px 7px #152b421a}
  .category-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin:18px 0 40px}
  .category-card{background:white;padding:22px;text-align:left;display:flex;align-items:flex-start;gap:16px;border-radius:17px;border:1px solid var(--line);box-shadow:var(--shadow);width:100%;transition:transform .18s,border-color .18s,box-shadow .18s}
  .category-icon{height:48px;width:48px;border-radius:14px;display:grid;place-items:center;font-size:24px;flex:none;background:var(--tint);color:var(--tone)}
  .category-content{min-width:0;flex:1}.category-content strong{font-size:17px;display:block;line-height:1.5}.category-content small{color:var(--muted);font-size:12px;display:block;margin:2px 0 9px}.category-count{font-size:11px;color:var(--tone);background:var(--tint);font-weight:900;padding:3px 10px;border-radius:999px}
  .category-title-line{display:flex;gap:14px;align-items:center;margin:3px 0 10px}
  .category-title-line .category-icon{height:52px;width:52px}
  .category-title-line .page-title{margin:0;font-size:27px}
  .category-title-line p{font-size:13px;color:var(--muted);margin:2px 0 0}
  .topic-stack{display:grid;gap:15px;padding-bottom:40px}
  .topic{background:white;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;padding:22px 24px}
  .topic-header{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;margin-bottom:15px}
  .topic h3{font-size:19px;line-height:1.5;letter-spacing:-.035em;margin:0}
  .topic-number{flex:none;border-radius:10px;background:#f4f7fb;color:#7a8da1;font-size:11px;font-weight:900;padding:5px 8px}
  .explain{padding:17px 20px;border-radius:13px;border-left:4px solid #55bd84;background:#f1fbf5}
  .explain.parent{background:#f7f3ff;border-left-color:#9670d8}
  .explain-label{display:block;font-size:12px;font-weight:900;color:#238452;margin-bottom:6px}
  .explain.parent .explain-label{color:#754db7}
  .explain p{white-space:pre-wrap;font-size:14px;line-height:1.95;margin:0;color:#33485c}
  .video-link{background:#fff5f5;color:#b9272c;display:flex;gap:8px;align-items:center;justify-content:center;text-align:center;border:1px solid #f4cece;border-radius:12px;padding:11px 15px;margin-top:16px;font-size:13px;font-weight:900;transition:background .15s}
  .video-link:hover{background:#ffe8e8}
  .quiz-wrap{max-width:750px;margin:0 auto 46px}
  .quiz-topline{display:flex;align-items:center;justify-content:space-between;margin:27px 0 12px}
  .quiz-count{font-size:14px;font-weight:900;color:#386486}
  .quit{background:transparent;border:0;color:#5e7690;font-weight:800;font-size:13px;padding:6px 4px}
  .progress{height:9px;border-radius:999px;overflow:hidden;background:#e1e9f1;margin-bottom:20px}
  .progress>div{height:100%;background:linear-gradient(90deg,#1670ca,#42a9e0);border-radius:999px;transition:width .2s}
  .quiz-card,.score-card{background:#fff;border-radius:22px;border:1px solid var(--line);padding:30px;box-shadow:var(--shadow)}
  .quiz-tag{display:inline-block;font-size:12px;font-weight:900;color:#275b91;background:#eaf3ff;border-radius:999px;padding:5px 11px;margin-bottom:15px}
  .quiz-prompt{font-size:13px;font-weight:850;color:#2c78bc;margin-bottom:5px}
  .quiz-question{font-size:17px;line-height:1.94;font-weight:800;white-space:pre-wrap;margin:0 0 22px}
  .answers{display:grid;gap:10px}
  .answer{background:#fff;border:2px solid #e2e9ef;border-radius:12px;text-align:left;padding:14px 17px;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:59px;color:#263f57;font-size:15px;font-weight:850;line-height:1.6;width:100%}
  .answer:not(:disabled):hover{border-color:#5b9dcc;background:#f3f9fe}
  .answer.correct{border-color:#42a775;background:#effaf3;color:#226841}
  .answer.wrong{border-color:#dc7979;background:#fff1f1;color:#933e3e}
  .answer.dimmed{opacity:.56}
  .result-panel{margin-top:18px;background:#f7faff;border:1px solid #d9e9f8;border-radius:17px;padding:22px}
  .result-panel h3{margin:0 0 11px;font-size:19px;color:#24638c}
  .result-panel h3.good{color:#198051}.result-panel h3.bad{color:#c34b4b}
  .result-panel p{font-size:14px;white-space:pre-wrap;line-height:1.9;margin:5px 0}
  .result-panel .answer-title{font-size:13px;color:#546c83;font-weight:800;margin-bottom:8px}
  .quiz-video{margin-top:15px}
  .main-button{display:inline-flex;justify-content:center;align-items:center;width:100%;border:0;border-radius:13px;background:#145ba8;color:white;font-weight:900;padding:14px 20px;margin-top:16px;text-align:center;min-height:50px}
  .main-button:hover{background:#10477f}
  .button-alt{background:#f1f5f9;color:#43617c}.button-alt:hover{background:#e8eef5}
  .score-card{text-align:center;margin:40px 0 0;padding:38px 30px}
  .score-emoji{display:grid;place-items:center;background:#fff4d9;border-radius:50%;height:92px;width:92px;margin:0 auto 16px;font-size:44px}
  .score-card h2{font-size:25px;margin:0 0 12px}
  .score-number{font-size:57px;font-weight:950;color:#175fa8;line-height:1.2;letter-spacing:-.06em}
  .score-number span{color:#91a1b2;font-size:22px;letter-spacing:normal}
  .score-card .progress{margin:18px auto 20px;max-width:420px}
  .score-message{font-weight:850;color:#48637b;margin-bottom:22px}
  .score-actions{max-width:420px;margin:auto}
  .score-actions .main-button{margin-top:10px}
  .site-note{font-size:12px;color:#78899b;margin:8px 0 0}
  @media(max-width:740px){.feature-grid{grid-template-columns:1fr}.feature{min-height:0;display:grid;grid-template-columns:48px 1fr 20px;grid-template-rows:auto auto;column-gap:15px;padding:18px}.feature .feature-icon{grid-row:1 / 3;grid-column:1;margin:0}.feature strong{grid-column:2;margin:0}.feature small{grid-column:2}.feature-arrow{grid-column:3;grid-row:1 / 3;align-self:center}.category-grid{grid-template-columns:1fr}.hero-content{padding:34px 28px}.hero:after{right:-230px}.offline-pill{font-size:11px}.playlist{margin-bottom:26px}}
  @media(max-width:450px){.shell{padding:0 15px}.hero{margin-top:17px;border-radius:22px}.hero-content{padding:31px 24px}.hero p{font-size:14px}.hero-pills{margin-top:20px}.page-top{padding:22px 0 19px}.brand{font-size:16px}.brand-mark{width:33px;height:33px;font-size:20px}.header-inner{min-height:58px}.header-right{gap:6px}.header-home{font-size:11px;padding:6px 9px}.offline-pill{font-size:10px;padding:5px 7px}.topic{padding:19px 16px}.explain{padding:14px}.quiz-card,.score-card{padding:21px 17px}.category-title-line .page-title{font-size:22px}.mode-switch{width:100%}.mode-switch button{font-size:12px;padding:9px 10px}.playlist{padding:15px}.playlist-body strong{font-size:14px}}
  @media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<header class="site-header"><div class="shell header-inner"><a class="brand" href="#home" data-action="home" aria-label="サッカーマスター ホームへ"><span class="brand-mark" aria-hidden="true">⚽</span><span>サッカーマスター</span></a><div class="header-right"><span class="offline-pill" title="図鑑とクイズはインターネット接続不要">オフライン対応</span><button type="button" class="header-home" data-action="home">ホーム</button></div></div></header>
<main id="app" class="shell" tabindex="-1"></main>
<footer class="footer shell"><div>収録：<strong>全22項目</strong> ／ Generated with Gemini（a.aitani）</div><div>図鑑とクイズはオフラインで使えます。YouTube動画の視聴にはインターネット接続が必要です。</div></footer>
<script>
"use strict";
// 外部ライブラリを一切使わない単一HTML。file:// でも動作します。
const PLAYLIST_URL = "https://youtube.com/playlist?list=PL4eMpu4COqCB2yzcHR3S5_HUBBm39rqch&si=atWPPArkO-55xjwV";
const DATA = [
  {id:1,category:"はじめの一歩",term:"時間と空間（じかんとくうかん）",desc:`プレーするときの「ゆとり」のこと。
ボールをうまく止められないと、ずっとボールを見ないといけなくて、相手が近くに来ちゃう。
速くて正かくなパスと、次にやりたいことがやりやすい場所にボールを止めると、考える時間とうごける場所ができるよ。`,parental_notes:`プレーの選択と実行には「認知（周りの状況を把握すること）」が重要です。時間と空間の認知は、選手がプレーする上での全ての判断の基礎となります。`,url:"https://www.youtube.com/watch?v=yqIh7DCYiek"},
  {id:2,category:"はじめの一歩",term:"止める・ける",desc:`ただ足もとに止めるだけじゃダメ。
次にやりたいことがやりやすい場所に正かくに止めよう。
そうすればボールを見る時間が短くなって、すぐ次にうごけるよ。
ボールをけるときは、速くて正かくで、受けとる人が止めやすいボールをけることが大切。`,parental_notes:`トラップが乱れると、ボールと身体の間に時間的なロスが生じます。このロスを軽減するには、パススピードを上げること、そしてトラップを次のプレーがしやすい場所に置く「質の高いトラップ」が不可欠です。トラップはボールを『隠す』意識も大切です。`,url:"https://www.youtube.com/watch?v=EDGRcQ7ZeME"},
  {id:3,category:"ボールを持つ",term:"正対（せいたい）",desc:`ボールを持った人が、相手のおなか（おへそ）を向けて向き合うこと。
そうすると右にも左にもパスやドリブルができるから、相手はどっちに来るかわからなくなるよ。`,parental_notes:`正対することで、ディフェンスを中央に固定した状態で、左右両方にプレーの選択肢が広がり、守備の難易度が上がります。この有利な状態を活かすには、左右へ正確にパスを切り分ける技術が求められます。`,url:"https://www.youtube.com/watch?v=1YmUFZsfOXU"},
  {id:7,category:"ボールを持つ",term:"ドリブルアット（べつの人へのしかけ）",desc:`自分をマークしている相手じゃなくて、ちがう守る人に向かってドリブルすること。
そうすると、その守る人は自分のことを見ちゃって、本当は見ていた味方を見られなくなる。
そのすきに味方がぬけ出せるよ。`,parental_notes:`ドリブラーが自分をマークしていないディフェンダーに向かってドリブルで仕掛け、相手ディフェンスの姿勢を崩します。これは、ディフェンスから自身を「消した」味方が裏へ走り出すためのきっかけ作りとなり、チャンスメイクにつながります。`,url:"https://www.youtube.com/watch?v=UyeO8wJch_g"},
  {id:8,category:"ボールを持つ",term:"運ぶドリブル（コンドゥクシオン）",desc:`ドリブルでボールを前にすすめて、相手の守りのラインをこえること。
これをすると、味方の人数が相手より多くなったり、相手の守りをくずしたりできる。
前に広い場所があるときにやるといいよ。`,parental_notes:`相手の守備ラインを越えることで、一時的に数的優位を生み出したり、相手陣形を崩したりする効果があります。前にスペースがある場合は、パスよりもこの「運ぶドリブル」が優先されることがあります。`,url:"https://www.youtube.com/watch?v=t3EZWL87fNc"},
  {id:9,category:"ボールを持つ",term:"パウサ（ゆっくりプレー）",desc:`わざとプレーをゆっくりして、じょうきょうが変わるのを待つこと。
ドリブルをゆっくりしたり、ボールをキープしたりして、味方がいい場所につく時間をつくる。
いつも速くプレーすればいいってわけじゃないんだ。`,parental_notes:`意図的にプレーのスピードを落とし（ポーズ）、周囲の状況の変化を待つことで、「ため」を生み出します。味方が優位なポジションにつく時間を作ったり、ボールをキープしたりする、ペースコントロールの技術です。`,url:"https://www.youtube.com/watch?v=ZY73UX3PDrg"},
  {id:20,category:"ボールを受ける",term:"デスマルケ（マークをはずすうごき）",desc:`相手の守る人をおいていって、ボールをもらううごき。ボールを持っている人に近づく「サポート」と、
相手のうしろの広い場所をねらう「とっぱ」の2つがあるよ。`,parental_notes:`マークしているディフェンスを置き去りにしてボールを受ける動きです。ボールに近づく「サポートのデスマルケ」と、スペースを狙う「突破のデスマルケ」があります。重要なのは、フリーでボールを受けられるかを確認することです。`,url:"https://www.youtube.com/watch?v=lSXh2Vzle3U"},
  {id:12,category:"ボールを受ける",term:"５つのサポート",desc:`ボールを持っていない人がするうごきで、５つある。
①前進（ぜんしん）：前でボールをもらう
②けいぞく：前にすすめないとき、ボールを持ちつづけるためにうごく
③きんきゅう時：ピンチのとき、ななめうしろでにげみちをつくる
④3人目：たてパスが出せないとき、ワンタッチでつなぐうごき
⑤こてい：その場にいて相手を引きつけ、味方にスペースをつくる`,parental_notes:`ボール保持者以外の選手が取るべきオフ・ザ・ボールの動き（前進、継続、緊急時、3人目、固定）を整理したものです。適切なポジションでボールを受ける（前進）、プレスを回避するパスコースの確保（継続）、ディフェンスをその場に固定し裏へ向かう動き（固定）など、多岐にわたります。`,url:"https://www.youtube.com/watch?v=XueCxZv1v0Q"},
  {id:22,category:"ボールを受ける",term:"フロントカット（前を走るうごき）",desc:`相手の守る人の前を走りぬけて、ボールが来る場所へ向かううごき。
オフサイドになりにくくて、パスをカットされにくいからいいよ。
うらへぬけるうごきと使いわけよう。`,parental_notes:`相手ディフェンダーの「前」を走り抜けることで、オフサイドのリスクが少なく、自身がパスコースとDFの間に入るため、パスカットのリスクも解消されます。ディフェンスの対応を難しくさせる動きです。`,url:"https://www.youtube.com/watch?v=II4okNHxsS8"},
  {id:16,category:"パスで崩す",term:"レイオフ（3人でのつなぎ）",desc:`3人で行うプレー。
1人目がパスを出して、2人目がワンタッチでうしろに落として、
3人目が前を向いてボールを受ける。
前を向きにくいときや、強いプレスを受けているときにやるといいよ。`,parental_notes:`縦パスを受けた選手が、サポートに来た3人目の選手にワンタッチで落とす一連の流れです。相手のタイトなプレスに対して有効なカウンターパンチとなり、素早い攻撃を可能にします。`,url:"https://www.youtube.com/watch?v=auXaASSZfaE"},
  {id:17,category:"パスで崩す",term:"4人目のうごき",desc:`レイオフの3人のプレーに合わせてうごく4人目の人のこと。
相手がボールを見ているすきに、4人目がまん中へ走りこんでチャンスをつくる。
早くパスを出すとうまくいくよ。`,parental_notes:`レイオフ（3人目の動き）に連動し、さらに別の選手が相手の死角から飛び込む高度な連携プレーを指します。パスを受けた選手が、この4人目の動きへパスを出すことで、決定機に持ち込むことができます。`,url:"https://www.youtube.com/watch?v=1rmHpByzj6s"},
  {id:13,category:"パスで崩す",term:"パスの出発点をズラす",desc:`たてへのパスが出せないとき、パスを受けてワンタッチでつないだり、
ボールの出る場所をずらしたりするうごき。
相手を引きつけて、パスコースやスペースをつくるよ。`,parental_notes:`ボール保持者に近づき、パスの出発点をずらす動き（アタカール・エル・バロン）を指します。これにより、ディフェンスを引きつけ、別の選手へのパスコースが生まれたり、フリーでボールを受けるスペースを創造する効果があります。`,url:"https://www.youtube.com/watch?v=LyyxB1IhYmI"},
  {id:19,category:"パスで崩す",term:"うしろへのパス",desc:`相手ゴール近くでうしろにパスを出すと、相手の守る人はボールを目で追って、
マークしている味方を見なくなっちゃう。
そのすきに味方がうごけば、マークをはずしやすくなるよ。`,parental_notes:`深い位置でのバックパスを選択すると、マークしていたディフェンダーはボールを追ってアクションを起こすことで、ディフェンスのマークが外れ、マークを外すことにつながります。特に、ディフェンスラインを下げさせた上でのバックパスは、押し上げようとする相手の逆を突くため、効果的です。`,url:"https://www.youtube.com/watch?v=d4-TSSq0-fk"},
  {id:10,category:"チームで攻める",term:"幅と深さ",desc:`せめるときにピッチをよこ（はば）とたて（ふかさ）に広く使うこと。
そうすると相手ひとりひとりが守るはんいが広くなって、
守りにくくなる。味方もボールをもらいやすくなるよ。`,parental_notes:`ピッチを縦（深さ）と横（幅）に広げることです。エリアが広がることで、一人当たりの守備範囲が大きくなります。また、パスの距離が長くなるため、スピードと正確性が求められます。`,url:"https://www.youtube.com/watch?v=L61SbQtFukQ"},
  {id:11,category:"チームで攻める",term:"ライン間 / 中間ポジション",desc:`相手の守りの人と人の間にある「ライン間」という広い場所。
そこに立つことを「中間ポジション」といって、
じゃまされずにボールをもらいやすくなるよ。`,parental_notes:`相手の守備ラインとラインの間にできるスペースです。ここでボールを受けることで、フリーでボールを受けられる可能性が高く、相手の守備陣形を引き上げさせる効果をもたらします。`,url:"https://www.youtube.com/watch?v=JnUxmaKg8gY"},
  {id:14,category:"チームで攻める",term:"ビルドアップ",desc:`うしろから前にボールを運ぶこと。ただ運ぶだけじゃなくて、
うしろでつくった有利なじょうきょうを前につないで、
ゴール前でチャンスをつくることが本当のもくてきなんだ。`,parental_notes:`単にボールを前線に運ぶことではなく、後方で生まれた数的優位による有利なスペースを、ボールを動かすことで前線へつないでいくことです。最終的にゴールにつながる、すなわちゴールを決めやすい優位な状況を作り出すことを目指します。`,url:"https://www.youtube.com/watch?v=s_4QfTyvKzA"},
  {id:15,category:"チームで攻める",term:"サリーダ・デ・バロン（ビルドアップのスタート）",desc:`ビルドアップの「出口」や「はじまり」のこと。
いちばんうしろから相手のプレスをかわして、
ボールを前に運ぶための広い場所やパスコースをつくる流れだよ。`,parental_notes:`スペイン語で「ボールの出口」を意味し、最終ラインから相手の最初のプレスをかわし、攻撃の起点を作るまでの一連の流れを指します。この「出口」を作り出すことで、ショートパスによるビルドアップが難しくなった状況を打破し、攻撃へつなげます。`,url:"https://www.youtube.com/watch?v=-mxoEzhyD0Q"},
  {id:21,category:"チームで攻める",term:"ロングボール（長いボール）",desc:`自分たちのエリアでショートパスがきけんなとき、
または相手のうらをねらいたいときに、長いボールをける。
空中せんがとくいな人を使ったり、前でプレスをかけたりする目てきもあるよ。`,parental_notes:`ボールロスのリスクを回避したい場合として選択されるほか、ディフェンスラインを押し下げたり、空中戦に強い選手を活用してボールをキープさせる意図もあります。さらに、局面を一気に進行させ、ハイプレスを仕掛ける手段にもなります。`,url:"https://www.youtube.com/watch?v=Gw_DukmuOrU"},
  {id:4,category:"ボールを奪う",term:"マークの3つのルール",desc:`相手をマークするときのきほんルール。
①マークする相手とボールを結ぶ線の上に立つ
②インターセプトできるきょりをとる
③ボールとマークする相手をりょうほう見る`,parental_notes:`年代からプロまで必ず覚えるべきマークの基本です。（1）マークとボールの中心を直線上に立つこと。（2）適切な距離をとりインターセプトが狙える位置をとること。（3）ボールとマークを同一視野に入れること。`,url:"https://www.youtube.com/watch?v=emSm99-AVnI"},
  {id:5,category:"ボールを奪う",term:"カバーシャドウ（かげでパスコースを消す）",desc:`プレスをかけるとき、自分のかげの中にパスコースが入るように立つこと。
パスコースを1つ消しながら相手にプレッシャーをかけて、えらべる場所を減らすよ。`,parental_notes:`プレスをかけるディフェンスが、自分の体で相手へのパスコースを一つ消しながらプレッシャーをかける守備技術です。これにより、相手選手の選択肢を減らした状態で守備をすることが可能になります。`,url:"https://www.youtube.com/watch?v=j5oBaOw8yyE"},
  {id:6,category:"ボールを奪う",term:"ワンサイドカット（かた方を切る守り方）",desc:`何人かで行う守り方。
「かた方のえらべる場所を切る」ことで、
ボールを持った相手のパスコースをへらす。
ねらった場所でボールをうばうために、チームでいっしょに相手を追いこむよ。`,parental_notes:`守備において、相手のプレーの選択肢を片側に限定し、誘導する考え方です。最終的には、チーム全体でカバーシャドウや他の選手との連携によってパスコースを限定し、ボールを奪いに行く状況を作り出します。`,url:"https://www.youtube.com/watch?v=Uwz_GS0wpcY"},
  {id:18,category:"ゴールキーパー",term:"はいきゅう（キーパーからのパス）",desc:`ゴールキーパーがキックやスローで味方にボールをわたすこと。
シュートを止めるだけじゃなくて、こうげきのスタートになるパスをする力と、
どこに出すかはんだんする力が大切だよ。`,parental_notes:`ゴールキーパー（GK）が、キックやスローなどにより味方にボールを配給するプレーを指します。GKにとって、シュートストップ能力に加えて、ビルドアップの起点となる能力が求められます。状況に応じてセンターバック、サイドバック、ボランチなど、最適な選手へボールを配給します。`,url:"https://www.youtube.com/watch?v=W47OMwVY86M"}
];
const CATEGORIES = [
 {name:"はじめの一歩",subtitle:"まずはここから！基本のき",icon:"👣",tone:"#a76711",tint:"#fff2df"},
 {name:"ボールを持つ",subtitle:"ドリブル・キープ",icon:"🏃",tone:"#21824b",tint:"#e5f8ee"},
 {name:"ボールを受ける",subtitle:"オフ・ザ・ボールの動き",icon:"🎯",tone:"#138094",tint:"#e5f8fb"},
 {name:"パスで崩す",subtitle:"味方とのコンビネーション",icon:"🤝",tone:"#2665aa",tint:"#eaf3ff"},
 {name:"チームで攻める",subtitle:"みんなでゴールを目指す戦術",icon:"🏆",tone:"#8050a6",tint:"#f4eafa"},
 {name:"ボールを奪う",subtitle:"ディフェンスの技術",icon:"🛡️",tone:"#c04e52",tint:"#fff0ef"},
 {name:"ゴールキーパー",subtitle:"守護神のスキル",icon:"🧤",tone:"#506982",tint:"#edf2f7"}
];
const state={screen:"home",isParent:false,category:null,questions:[],index:0,score:0,chosen:null};
const app=document.getElementById("app");
function esc(value){return String(value).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}
function shuffle(items){const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function goTop(){window.scrollTo(0,0);}
function showHome(){state.screen="home";state.category=null;state.chosen=null;render();goTop();}
function showCategories(parent){state.screen="categories";state.isParent=parent;state.category=null;render();goTop();}
function showCategory(name){if(!CATEGORIES.some(c=>c.name===name))return;state.screen="category";state.category=name;render();goTop();}
function switchMode(parent){state.isParent=parent;render();}
function startQuiz(){const selected=shuffle(DATA).slice(0,10);state.questions=selected.map(correct=>({correct,options:shuffle([correct,...shuffle(DATA.filter(i=>i.id!==correct.id)).slice(0,3)])}));state.screen="quiz";state.index=0;state.score=0;state.chosen=null;render();goTop();}
function chooseAnswer(id){if(state.screen!=="quiz"||state.chosen!==null)return;const q=state.questions[state.index];if(!q.options.some(o=>o.id===id))return;state.chosen=id;if(id===q.correct.id)state.score+=1;render();}
function nextQuestion(){if(state.screen!=="quiz"||state.chosen===null)return;if(state.index<state.questions.length-1){state.index++;state.chosen=null;render();goTop();}else{state.screen="score";render();goTop();}}
function categoryIcon(c){return `<span class="category-icon" aria-hidden="true" style="--tint:${c.tint};--tone:${c.tone}">${c.icon}</span>`;}
function modeSwitch(){return `<div class="mode-switch" role="group" aria-label="表示モード"><button type="button" data-action="mode-child" aria-pressed="${!state.isParent}">📗 子ども向け</button><button type="button" data-action="mode-parent" aria-pressed="${state.isParent}">👤 保護者向け</button></div>`;}
function renderHome(){return `<section class="hero"><div class="hero-content"><div class="eyebrow">SOCCER LEARNING LIBRARY</div><h1>⚽ サッカー<br>マスター</h1><p>「なんとなく」から「わかった！」へ。<br>ワザを知って、試合で使える選手になろう！</p><div class="hero-pills"><span>📘 22のワザ</span><span>🎯 7つのカテゴリ</span><span>🧠 10問チャレンジ</span></div></div></section><div class="section-head"><div><h2>どこから始める？</h2><p>好きな学び方を選んでね。</p></div></div><div class="feature-grid"><button type="button" class="feature green" data-action="learn-child"><span class="feature-icon" aria-hidden="true">📗</span><strong>小学生用の ずかん</strong><small>ワザをおぼえよう</small><span class="feature-arrow" aria-hidden="true">›</span></button><button type="button" class="feature purple" data-action="learn-parent"><span class="feature-icon" aria-hidden="true">👤</span><strong>保護者用 詳細ポイント</strong><small>より深い解説・指導のコツを学ぶ</small><span class="feature-arrow" aria-hidden="true">›</span></button><button type="button" class="feature orange" data-action="quiz-start"><span class="feature-icon" aria-hidden="true">🧠</span><strong>クイズにちょうせん</strong><small>10問ランダム出題。サッカー博士をめざせ！</small><span class="feature-arrow" aria-hidden="true">›</span></button></div><a class="playlist" href="${esc(PLAYLIST_URL)}" target="_blank" rel="noopener noreferrer"><span class="yt-bubble" aria-hidden="true">▶</span><span class="playlist-body"><strong>22のワザを1度にまなぶ</strong><span>YouTubeプレイリストへ（インターネット接続が必要）</span></span><span class="playlist-arrow" aria-hidden="true">↗</span></a>`;}
function renderCategories(){return `<div class="page-top"><button class="back" type="button" data-action="home">‹ ホームへ</button><h1 class="page-title">${state.isParent?"👤 保護者用 詳細ポイント":"📗 小学生用の ずかん"}</h1><p class="intro">${state.isParent?"どのカテゴリの詳細を見ますか？":"どのカテゴリから学びますか？"}</p>${modeSwitch()}</div><div class="category-grid">${CATEGORIES.map(c=>`<button type="button" class="category-card" data-action="category" data-category="${esc(c.name)}" style="--tone:${c.tone};--tint:${c.tint}">${categoryIcon(c)}<span class="category-content"><strong>${esc(c.name)}</strong><small>${esc(c.subtitle)}</small><span class="category-count">${DATA.filter(d=>d.category===c.name).length} 項目</span></span></button>`).join("")}</div>`;}
function renderCategory(){const c=CATEGORIES.find(c=>c.name===state.category);if(!c)return renderCategories();const entries=DATA.filter(d=>d.category===c.name);return `<div class="page-top"><button class="back" type="button" data-action="categories">‹ カテゴリ一覧へ</button><div class="category-title-line">${categoryIcon(c)}<div><h1 class="page-title">${esc(c.name)}</h1><p>${esc(c.subtitle)} ・ ${entries.length}項目</p></div></div>${modeSwitch()}</div><div class="topic-stack">${entries.map(item=>`<article class="topic"><div class="topic-header"><h3>${esc(item.term)}</h3><span class="topic-number">No. ${String(item.id).padStart(2,"0")}</span></div><div class="explain${state.isParent?" parent":""}"><span class="explain-label">${state.isParent?"【保護者用 詳細ポイント】":"【解説】"}</span><p>${esc(state.isParent?item.parental_notes:item.desc)}</p></div><a class="video-link" href="${esc(item.url)}" target="_blank" rel="noopener noreferrer">▶ 動画で見る（YouTube） ↗</a></article>`).join("")}</div>`;}
function renderQuiz(){const q=state.questions[state.index];if(!q)return renderHome();const answered=state.chosen!==null;const right=state.chosen===q.correct.id;return `<div class="quiz-wrap"><div class="quiz-topline"><span class="quiz-count">第 ${state.index+1} 問 ／ ${state.questions.length} 問</span><button class="quit" type="button" data-action="home">やめる ×</button></div><div class="progress" aria-label="クイズの進行状況"><div style="width:${(state.index+1)/state.questions.length*100}%"></div></div><section class="quiz-card"><span class="quiz-tag">${esc(q.correct.category)}</span><div class="quiz-prompt">これ、なーんだ？</div><h1 class="quiz-question">${esc(q.correct.desc)}</h1><div class="answers">${q.options.map(opt=>{let cls="answer";if(answered){cls+=opt.id===q.correct.id?" correct":opt.id===state.chosen?" wrong":" dimmed";}return `<button type="button" class="${cls}" data-action="answer" data-id="${opt.id}" ${answered?"disabled":""} aria-label="${esc(opt.term)}"><span>${esc(opt.term)}</span>${answered&&opt.id===q.correct.id?"<span aria-hidden=\"true\">✓</span>":answered&&opt.id===state.chosen?"<span aria-hidden=\"true\">✕</span>":""}</button>`;}).join("")}</div></section>${answered?`<section class="result-panel" aria-live="polite"><h3 class="${right?"good":"bad"}">${right?"🎉 せいかい！":"💡 おしい！次にいかそう"}</h3><div class="answer-title">正解：${esc(q.correct.term)}</div><p>${esc(q.correct.parental_notes)}</p><a class="video-link quiz-video" href="${esc(q.correct.url)}" target="_blank" rel="noopener noreferrer">▶ 動画で復習する ↗</a><button type="button" class="main-button" data-action="quiz-next">${state.index===state.questions.length-1?"結果を見る":"次の問題へ →"}</button></section>`:""}</div>`;}
function renderScore(){const total=state.questions.length||10;const pct=state.score/total*100;const message=state.score===total?"すごい！サッカー博士レベルだ！🏆":state.score>total/2?"あとすこし！動画を見て復習しよう 👍":"あきらめずに チャレンジしよう！💪";return `<div class="quiz-wrap"><section class="score-card"><div class="score-emoji" aria-hidden="true">🏆</div><h2>結果はっぴょう！</h2><div class="score-number">${state.score}<span> / ${total}</span></div><div class="progress" aria-label="正答率 ${pct}%"><div style="width:${pct}%"></div></div><p class="score-message">${message}</p><div class="score-actions"><button type="button" class="main-button" data-action="quiz-start">もう一度ちょうせん</button><button type="button" class="main-button button-alt" data-action="home">ホームに戻る</button></div></section></div>`;}
function render(){switch(state.screen){case "categories":app.innerHTML=renderCategories();break;case "category":app.innerHTML=renderCategory();break;case "quiz":app.innerHTML=renderQuiz();break;case "score":app.innerHTML=renderScore();break;default:app.innerHTML=renderHome();}}
document.addEventListener("click",event=>{const button=event.target.closest("[data-action]");if(!button)return;if(button.tagName==="A")event.preventDefault();const action=button.dataset.action;switch(action){case "home":showHome();break;case "learn-child":showCategories(false);break;case "learn-parent":showCategories(true);break;case "categories":showCategories(state.isParent);break;case "category":showCategory(button.dataset.category);break;case "mode-child":switchMode(false);break;case "mode-parent":switchMode(true);break;case "quiz-start":startQuiz();break;case "answer":chooseAnswer(Number(button.dataset.id));break;case "quiz-next":nextQuestion();break;}});
render();
</script>
</body>
</html>
